%YAML 1.2
---
$id: http://devicetree.org/schemas/reset/samsung,exynos7870-dispaud-reset.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos7870 DISPAUD block soft reset controller

maintainers:
  - Istvan Lovas <avataristvan@googlemail.com>

description:
  Soft reset register in the DISPAUD sysreg (DISPAUD_CFG). Each bit resets
  one audio block and is active high; bit 0 is the audio mixer, bit 1 the
  MI2S controller, bit 2 the AMP and bit 3 the audio DMA.

properties:
  compatible:
    const: samsung,exynos7870-dispaud-reset

  reg:
    maxItems: 1

  '#reset-cells':
    const: 1

required:
  - compatible
  - reg
  - '#reset-cells'

additionalProperties: false

examples:
  - |
    reset-controller@148f1000 {
        compatible = "samsung,exynos7870-dispaud-reset";
        reg = <0x148f1000 0x4>;
        #reset-cells = <1>;
    };
