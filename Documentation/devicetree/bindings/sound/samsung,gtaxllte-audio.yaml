%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/samsung,gtaxllte-audio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Galaxy Tab A 10.1 LTE (SM-T585) audio complex with RT5659 codec

maintainers:
  - Istvan Lovas <avataristvan@googlemail.com>

allOf:
  - $ref: sound-card-common.yaml#

properties:
  compatible:
    const: samsung,gtaxllte-audio

  hp-det-gpios:
    maxItems: 1
    description: Combo jack insertion detect.

  cpu:
    type: object
    additionalProperties: false
    properties:
      sound-dai:
        maxItems: 1
        description: The I2S controller DAI.
    required:
      - sound-dai

  codec:
    type: object
    additionalProperties: false
    properties:
      sound-dai:
        items:
          - description: The S1402X audio mixer DAI.
          - description: The RT5659 codec DAI.
    required:
      - sound-dai

required:
  - compatible
  - model
  - cpu
  - codec

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    sound {
        compatible = "samsung,gtaxllte-audio";
        model = "SM-T585";
        hp-det-gpios = <&gpa0 5 GPIO_ACTIVE_LOW>;
        audio-routing = "Headphone", "HPOL",
                        "Headphone", "HPOR";

        cpu {
            sound-dai = <&i2s0 0>;
        };

        codec {
            sound-dai = <&audio_mixer>, <&rt5659>;
        };
    };
